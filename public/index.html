<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>web-splat</title>
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/normalize.css@8/normalize.css">
    <style>
        /* The body fills the visible part of the page. 100vh would be wrong on phones: it is the
           height with the address bar and toolbars hidden, so the bottom of the page (and
           everything that is anchored there) would be behind them. */
        body {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            margin: 0;
            overflow: hidden;
            background-color: black;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            touch-action: none;
            /* Prevent default touch behaviors like scrolling and zooming */
            -webkit-touch-callout: none;
            /* Disable callout on iOS */
            -webkit-user-select: none;
            /* Disable selection on iOS */
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        #spinner {
            position: absolute;
            top: calc(50% - 48px);
            left: calc(50% - 48px);
            z-index: 1000;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #spinner p {
            opacity: 0.5;
            font-size: small;
        }

        .loader {
            width: 96px;
            height: 96px;
            display: inline-block;
            position: relative;
        }

        .loader::after,
        .loader::before {
            content: '';
            box-sizing: border-box;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid #FFF;
            position: absolute;
            left: 0;
            top: 0;
            animation: animloader 2s linear infinite;
        }

        .loader::after {
            animation-delay: 1s;
        }

        @keyframes animloader {
            0% {
                transform: scale(0);
                opacity: 1;
            }

            100% {
                transform: scale(1);
                opacity: 0;
            }
        }

        svg {
            width: 114px;
            height: 114px;
            margin: 1em;
        }

        .bg {
            fill: none;
            stroke-width: 10px;
            stroke: #1A2C34;
        }

        [class^="meter-"] {
            fill: none;
            stroke-width: 5px;
            stroke-linecap: round;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;

        }

        .meter-1 {
            stroke-dasharray: 360;
            stroke-dashoffset: 360;
            stroke: white;
            animation: progress-1 1s ease-out;
        }

        .alert {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            height: 100%;
        }

        canvas {
            touch-action: none;
            /* Prevent default touch behaviors */
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
    </style>
    <div id="spinner" style="display: none;">
        <svg>
            <circle class="bg" cx="57" cy="57" r="52" />
            <circle class="meter-1" cx="57" cy="57" r="52" />
            <text id="loading-display" fill="white" x="50%" y="50%" text-anchor="middle"
                alignment-baseline="middle">10%</text>
        </svg>
    </div>
    <div id="no-file" class="alert" style="display: none;">
        <h1>No file specified</h1>
        <p>There is no file specified in the URL.</p>
    </div>
    <div id="no-webgpu" class="alert" style="display: none;">
        <h1>WebGPU not supported</h1>
        <p>Your browser supports neither WebGPU nor WebGL2.<br><a
                href="https://developer.mozilla.org/en-US/docs/Web/API/WebGPU_API#browser_compatibility">Please use a
                browser that supports WebGPU.</a></p>
        <button id="use-webgl" style="display: none; font-size: 1.1em; padding: 0.5em 1.2em; cursor: pointer;">Use
            WebGL</button>
    </div>
    <div id="loading-error" class="alert" style="display: none;">
        <h1>An error occured</h1>
        <p></p>
    </div>
</head>

<body>
    <script type="module">

        async function checkWebGPU() {
            if (!navigator.gpu) {
                return false;
            }
            try {
                let adapter = await navigator.gpu.requestAdapter()
                let device = await adapter.requestDevice();
                return true
            } catch (e) {
                return false;
            }
        }

        // The backend can be forced with the url parameter "backend" (webgpu or webgl). Without
        // it the viewer uses WebGPU and falls back to WebGL2, which renders with a CPU sort.
        function checkWebGL2() {
            try {
                return !!document.createElement("canvas").getContext("webgl2");
            } catch (e) {
                return false;
            }
        }

        function urlWithBackend(backend) {
            const p = new URLSearchParams(window.location.search);
            p.set("backend", backend);
            return window.location.pathname + "?" + p.toString();
        }

        const forced_backend = new URLSearchParams(window.location.search).get("backend");
        const webgl2_available = checkWebGL2();
        const has_webgpu = forced_backend === "webgl" ? false : await checkWebGPU();
        const has_webgl = forced_backend === "webgpu" ? false : webgl2_available;
        if (!has_webgpu && !has_webgl) {
            const alert = document.getElementById("no-webgpu");
            alert.style.display = "flex";
            const text = alert.getElementsByTagName("p")[0];
            if (forced_backend === "webgpu" && webgl2_available) {
                // WebGPU was requested but is not there, WebGL2 can be used instead
                text.innerHTML = "Your browser does not support WebGPU.<br>The viewer can use WebGL instead " +
                    "(the splats are sorted on the CPU).";
                const button = document.getElementById("use-webgl");
                button.style.display = "inline-block";
                button.onclick = () => { window.location.href = urlWithBackend("webgl"); };
            } else if (forced_backend) {
                text.innerHTML = "The requested backend (" + forced_backend + ") is not supported by your browser.<br>" +
                    "<a href=\"" + window.location.pathname + window.location.search.replace(/[?&]backend=[^&]*/, "").replace(/^&/, "?") + "\">Open the viewer without forcing a backend</a>";
            }
            throw Error("The graphics backend is not supported.");
        }

        import init, { run_wasm, PointCloudLoader } from "./web_splats.js";
        let init_promise = init();

        let params = new URLSearchParams(window.location.search);
        let scene_file = params.get("scene");
        let pc_file = params.get("file");


        function showProgress(loaded, total) {
            if (total) {
                document.querySelector('.meter-1').style.strokeDashoffset = 360 - Math.round(loaded / total * 360);
            }
            document.querySelector('#loading-display').innerHTML = Math.round(loaded / (1024 * 1024) * 10) / 10 + " MB"
        }

        function concat(chunks) {
            const data = new Uint8Array(chunks.reduce((n, c) => n + c.byteLength, 0));
            let offset = 0;
            for (const c of chunks) {
                data.set(c, offset);
                offset += c.byteLength;
            }
            return data;
        }

        // Downloads the point cloud. Ply files are streamed: the viewer opens when the header
        // arrived and the points appear while the rest is downloading. Other formats are
        // downloaded completely before the viewer opens.
        async function loadPointCloud(response, scene_data) {
            if (!response.ok) {
                throw new Error("Cannot download file", { cause: response });
            }
            const total = parseInt(response.headers.get('content-length') || 0, 10);
            const reader = response.body.getReader();
            // timing, to find out what is slow (see the console)
            const t_start = performance.now();
            let push_ms = 0;
            let loaded = 0;
            let loader = null;
            let started = false;
            let pending = []; // data until the file format is known, or the whole file for formats that cannot be streamed
            let pendingBytes = 0;
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                loaded += value.byteLength;
                showProgress(loaded, total);
                if (loader) {
                    const t = performance.now();
                    loader.push(value);
                    push_ms += performance.now() - t;
                } else {
                    pending.push(value);
                    pendingBytes += value.byteLength;
                    if (pendingBytes >= 3) {
                        const head = concat(pending);
                        if (head[0] == 0x70 && head[1] == 0x6c && head[2] == 0x79) { // "ply"
                            loader = new PointCloudLoader();
                            loader.push(head);
                            pending = [];
                        }
                    }
                }
                if (loader && !started && loader.is_ready()) {
                    loader.start_viewer(scene_data, pc_file, scene_file);
                    started = true;
                    console.log(`viewer started after ${((performance.now() - t_start) / 1000).toFixed(1)} s`);
                }
            }
            console.log(`download finished after ${((performance.now() - t_start) / 1000).toFixed(1)} s, ` +
                `${(loaded / 1048576).toFixed(0)} MB, ${(push_ms / 1000).toFixed(1)} s of it parsing the ply (main thread)`);
            if (loader) {
                loader.finish();
                if (!started) {
                    loader.start_viewer(scene_data, pc_file, scene_file);
                }
            } else {
                run_wasm(concat(pending), scene_data, pc_file, scene_file);
            }
        }
        if (!pc_file) {
            document.getElementById("no-file").style.display = "flex";
        } else {
            try {
                document.getElementById("spinner").style.display = "flex";
                let pc_promise = fetch(pc_file);
                var scene_promise = Promise.resolve(null);
                if (scene_file) {
                    scene_promise = fetch(scene_file, {
                        headers: {
                            'Accept': 'application/json',
                        }
                    }).then(r => r.arrayBuffer()).then(data => new Uint8Array(data))
                }

                let [pc_response, scene_data] = await Promise.all([pc_promise, scene_promise]);
                await init_promise;
                await loadPointCloud(pc_response, scene_data);
            } catch (e) {
                document.getElementById("spinner").style.display = "none";
                let errorPane = document.getElementById("loading-error");
                errorPane.style.display = "flex";
                errorPane.getElementsByTagName("p")[0].innerHTML = e.message + ("cause" in e ? ": " + e.cause.statusText : "") + "<pre>" + pc_file + "</pre>";
                console.error(e);
            }
            window.addEventListener('resize', function (event) {
                // (the size of the canvas in pixels, not in css pixels)
                const canvas = document.getElementById("window-canvas");
                canvas.width = Math.round(window.innerWidth * window.devicePixelRatio);
                canvas.height = Math.round(window.innerHeight * window.devicePixelRatio);
            }, true);

            document.addEventListener('contextmenu', event => event.preventDefault());
        }
    </script>
</body>

</html>
